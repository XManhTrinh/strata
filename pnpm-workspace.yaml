packages:
  - "apps/*"
  - "packages/*"

# pnpm holds back packages published in the last day; Windmorph's own releases are trusted.
minimumReleaseAgeExclude:
  - '@windmorph/react@0.1.1'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  # Postinstall only prints a funding message.
  '@nestjs/core': false
  # Postinstall only fetches a fallback binary; the prebuilt optional dependency is used.
  unrs-resolver: false
