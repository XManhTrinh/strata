# Single app: no workspace packages. This file only holds pnpm settings.

# pnpm holds back packages published in the last day; Windmorph's own releases are trusted.
minimumReleaseAgeExclude:
  - "@windmorph/react"

allowBuilds:
  # Both ship prebuilt binaries as optional dependencies; their install scripts are fallbacks.
  "@parcel/watcher": false
  "@swc/core": false
  # Postinstall only fetches a fallback binary; the prebuilt optional dependency is used.
  unrs-resolver: false
