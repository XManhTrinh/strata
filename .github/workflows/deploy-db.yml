name: Deploy database migrations

# Migrations reach staging automatically when they land on main, and production only when
# someone runs this workflow by hand (the production environment requires approval).
#
# The workflow connects straight to the database with SUPABASE_DB_URL (the session pooler
# connection string, which works over IPv4 from GitHub's runners). It needs no Supabase access
# token: applying migrations only needs the database connection.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-db-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Check the connection string is set
        run: test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL is not set for this environment." >&2; exit 1; }
      - name: Show migration status
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Dry run
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        run: supabase db push --yes --db-url "$SUPABASE_DB_URL"
