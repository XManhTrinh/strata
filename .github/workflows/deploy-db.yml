name: Deploy database migrations

# Migrations reach staging automatically when they land on main, and production only when
# someone runs this workflow by hand (the production environment requires approval).
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      debug:
        description: Show the Supabase CLI's requests (for troubleshooting token permissions)
        type: boolean
        default: false

concurrency:
  group: deploy-db-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" ${{ inputs.debug && '--debug' || '' }}
      - name: Show pending migrations
        run: supabase migration list
      - name: Apply migrations
        run: supabase db push
