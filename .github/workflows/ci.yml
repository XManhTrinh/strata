name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Windmorph Pro installs from its private repository with a read-only token.
  WINDMORPH_PRO_TOKEN: ${{ secrets.WINDMORPH_PRO_TOKEN }}

jobs:
  checks:
    name: Lint, types, unused code, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Allow installing Windmorph Pro
        run: git config --global url."https://x-access-token:${WINDMORPH_PRO_TOKEN}@github.com/XManhTrinh/windmorph-pro".insteadOf "https://github.com/XManhTrinh/windmorph-pro"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm format:check
      - run: pnpm test

  database-and-e2e:
    name: Database tests, type drift, end-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Allow installing Windmorph Pro
        run: git config --global url."https://x-access-token:${WINDMORPH_PRO_TOKEN}@github.com/XManhTrinh/windmorph-pro".insteadOf "https://github.com/XManhTrinh/windmorph-pro"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start --exclude studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Export local Supabase settings
        run: |
          status="$(supabase status -o json)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<<"$status")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<<"$status")"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"
      - run: pnpm db:test
      - name: Generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code src/lib/supabase/database.types.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
