[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["corepack enable && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @strata/database build && pnpm --filter @strata/auth build && pnpm --filter @strata/validation build && pnpm --filter @strata/shared-types build && pnpm --filter @strata/api build && pnpm --filter @strata/worker build"]
