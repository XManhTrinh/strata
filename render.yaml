services:
  - type: web
    name: strata-api
    runtime: node
    region: eu-west-1
    plan: free
    rootDir: .
    # The workspace install includes the web app, which installs Windmorph Pro from its private
    # repo; PRO_READ_TOKEN is a fine-grained, read-only GitHub token for XManhTrinh/windmorph-pro.
    buildCommand: test -n "$PRO_READ_TOKEN" && git config --global url."https://x-access-token:$PRO_READ_TOKEN@github.com/XManhTrinh/windmorph-pro".insteadOf https://github.com/XManhTrinh/windmorph-pro && NPM_CONFIG_PRODUCTION=false pnpm install && pnpm --filter @strata/database build && pnpm --filter @strata/api build
    startCommand: cd apps/api && node dist/main.js
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PRO_READ_TOKEN
        sync: false
