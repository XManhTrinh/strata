services:
  - type: web
    name: strata-api
    runtime: node
    region: eu-west-1
    plan: free
    rootDir: .
    buildCommand: pnpm install && cd packages/database && npx prisma generate --schema=prisma/schema.prisma && cd ../../apps/api && npx nest build
    startCommand: cd apps/api && node dist/main.js
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
